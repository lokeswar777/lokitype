<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-adsense-account" content="ca-pub-3786557782032785">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Loki Types: a clean, fast typing speed test. Measure your WPM and accuracy." />
    <meta name="theme-color" content="#0b0f17" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="" />
    <title>Loki Types</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      // Keep the storage key in sync with src/theme.js.
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("lokitype-theme");
          if (saved === "light" || saved === "dark" || saved === "glass") {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light";
          }
        } catch (e) {
          // Storage unavailable: fall back to the default theme.
        }
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        var colors = { light: "#f3f5fa", dark: "#0b0f17", glass: "#0b1030" };
        if (meta) meta.setAttribute("content", colors[theme]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
